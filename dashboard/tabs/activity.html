<!-- ── Tab: Tool Results ─────────────────────────────────────────────────────
     One goal: show what every tool that ran actually FOUND — ports, subdomains,
     endpoints, technologies, template matches, secrets — without reading logs,
     so the operator can see quickly whether Smith is on track and steer it.
     Data: GET /api/tool-results (core/tool_results.py). Rendered by tool-results.js.
     (The tab keeps the id "activity" so existing links and badges still work.) -->
<div id="tab-activity" class="tab-content">
  <div class="tab-head">
    <h2>Tool Results</h2>
    <p>What each tool found in this scan. Open a card to see its results, and steer Smith from there if it has gone off track.</p>
  </div>

  <!-- What the scan knows so far, across all tools. -->
  <div id="tr-overview" class="tr-overview" hidden></div>

  <div class="act-toolbar">
    <input id="tr-search" type="search" placeholder="Search results (port, path, host, template…)" aria-label="Search tool results"
           autocomplete="off" spellcheck="false">
    <span id="tr-summary" class="air-sub-note"></span>
    <span class="fx-grow"></span>
    <button type="button" class="btn btn-secondary btn-sm" id="tr-expand" onclick="toggleAllToolCards()">Expand all</button>
  </div>

  <div id="tr-cards"><div class="empty-placeholder">No tools have run yet. Each tool Smith runs gets a card here with what it found.</div></div>
</div>

<!-- Raw output of one tool run. -->
<dialog id="tr-raw-dialog" class="scan-dialog tr-raw-dialog" aria-labelledby="tr-raw-title">
  <div class="scan-dialog-head">
    <h3 id="tr-raw-title">Raw output</h3>
    <button type="button" class="scan-dialog-close" onclick="document.getElementById('tr-raw-dialog').close()" aria-label="Close">✕</button>
  </div>
  <div class="tr-raw-meta" id="tr-raw-meta"></div>
  <pre class="tr-raw-text" id="tr-raw-text"></pre>
</dialog>
