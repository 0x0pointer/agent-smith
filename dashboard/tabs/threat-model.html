<!-- ── Tab: Threat Model ─────────────────────────────────────────────────── -->
<div id="tab-threat-model" class="tab-content">
  <div id="tm-toolbar" style="display:flex;align-items:center;gap:1rem;margin-bottom:0.75rem;font-size:var(--fs-sm);">
    <select id="tm-file-select" onchange="onTmFileChange()"
      style="background:var(--bg-card);border:1px solid var(--border);color:var(--text);border-radius:var(--r-sm);
             padding:0.2rem 0.5rem;font-size:var(--fs-xs);font-family:var(--font-mono);max-width:320px">
      <option value="">latest</option>
    </select>
    <span id="tm-file-ts" style="color:var(--text-dim);font-family:var(--font-mono);font-size:var(--fs-xs)"></span>
  </div>
  <div id="threat-model-wrap" class="empty">No threat model yet — run the threat-modeling in <code>/pentester</code></div>
</div>
