<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Same defense-in-depth CSP as the dashboard shell. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
  <title>Finding · Agent-Smith Pentester Platform</title>
  <link rel="icon" type="image/vnd.microsoft.icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
  <!-- Vendored locally — no runtime CDN dependency (see js/vendor/README.md). -->
  <script src="/static/js/vendor/mermaid.min.js"></script>
  <script src="/static/js/vendor/marked.min.js"></script>
  <link rel="stylesheet" href="/static/css/dashboard.css?v=10">
</head>
<body class="dossier-page">

<div class="dossier-shell" data-finding-id="{{ finding_id }}">
  <header class="dossier-topbar">
    <a class="dossier-back" href="/"
       onclick="if (window.history.length > 1) { window.history.back(); return false; }">&#8592; All findings</a>
    <div class="dossier-brand">
      <img class="dossier-logo" src="/static/img/logo-full.svg" alt="Agent-Smith Pentester Platform" onerror="this.style.display='none'">
    </div>
  </header>

  <div id="dossier-status" class="dossier-status"><span class="dot"></span>Loading finding…</div>
  <div id="dossier-root"></div>
</div>

<script src="/static/js/shared.js"></script>
<script src="/static/js/finding.js"></script>
</body>
</html>
