sonar.projectKey=0x0pointer_agent-smith
sonar.organization=0x0pointer

sonar.projectName=agent-smith
sonar.projectVersion=0.2.0

sonar.sources=core,tools,mcp_server
sonar.tests=tests
sonar.exclusions=tools/kali/**,tools/metasploit/**,**/__pycache__/**,**/*.pyc
sonar.coverage.exclusions=mcp_server/**,tools/kali/**,tools/metasploit/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Use bundled JRE — avoids scanner 7.x JRE provisioning API call that
# fails before authentication and incorrectly reports a token error.
sonar.scanner.javaVersion=BUNDLED

# ── Documented rule exclusions ────────────────────────────────────────────────
# These are intentional/by-design or false positives; each is scoped as narrowly
# as possible so real issues elsewhere still surface.
sonar.issue.ignore.multicriteria=r1,r2,r3,r4,r5,r6,r7

# S2245 (pseudorandom): the transform()/redteam() engines use `random` ONLY to
# generate attack-payload variety and SEEDED-REPRODUCIBLE test inputs (the k/N
# replay depends on that determinism) — never security tokens/secrets. A crypto
# RNG is neither needed nor seedable here. Non-security by design.
sonar.issue.ignore.multicriteria.r1.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.r1.resourceKey=mcp_server/transforms/**
sonar.issue.ignore.multicriteria.r2.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.r2.resourceKey=mcp_server/redteam/**

# S7628 (hidden unicode): arc_pi_taxonomy.json is a VENDORED security dataset
# (Arcanum PITAX) whose entries deliberately contain hidden-unicode attack
# payloads — the payloads ARE the data.
sonar.issue.ignore.multicriteria.r3.ruleKey=text:S7628
sonar.issue.ignore.multicriteria.r3.resourceKey=mcp_server/redteam/data/**

# S2083 (path traversal): ai_redteam._save() writes ONLY to a constant path
# (paths.AI_REDTEAM_FILE); no user input reaches the file path. Cross-procedure
# taint false positive.
sonar.issue.ignore.multicriteria.r4.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.r4.resourceKey=core/ai_redteam.py

# Docker (garak image): S6471 — the scanner runs ephemerally (`docker run --rm`)
# against a bind-mounted /work volume with no listening service, so the default
# user is required for volume read/write. S8541 — garak's pinned deps need sdist
# builds, so `--only-binary :all:` would break the image.
sonar.issue.ignore.multicriteria.r5.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.r5.resourceKey=tools/garak/**
sonar.issue.ignore.multicriteria.r6.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.r6.resourceKey=tools/garak/**

# S7483 (timeout param): run_garak()/ensure_image() expose a `timeout` argument as
# part of their public API (callers tune it per scan); the value is applied via
# asyncio.wait_for internally.
sonar.issue.ignore.multicriteria.r7.ruleKey=python:S7483
sonar.issue.ignore.multicriteria.r7.resourceKey=tools/garak_runner.py
